<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loginha de Programa</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1>🛒 Loginha de Programa</h1>

  <h2>Produtos</h2>
  <table>
    <tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Qtd.</th><th></th></tr>
    <tr><td>⌨️ Teclado</td><td>R$ 120,00</td><td>5</td>
        <td><input type="number" value="1" min="1" max="5"></td><td><button>Adicionar</button></td></tr>
    <tr><td>🖱️ Mouse</td><td>R$ 60,00</td><td>8</td>
        <td><input type="number" value="1" min="1" max="8"></td><td><button>Adicionar</button></td></tr>
    <tr><td>🎙️ Microfone</td><td>R$ 250,00</td><td>3</td>
        <td><input type="number" value="1" min="1" max="3"></td><td><button>Adicionar</button></td></tr>
    <tr><td>🎧 Headset</td><td>R$ 180,00</td><td>4</td>
        <td><input type="number" value="1" min="1" max="4"></td><td><button>Adicionar</button></td></tr>
    <tr><td>📷 Webcam</td><td>R$ 200,00</td><td>2</td>
        <td><input type="number" value="1" min="1" max="2"></td><td><button>Adicionar</button></td></tr>
  </table>

  <h2>Carrinho</h2>
  <div class="vazio">
    <p>🛒 O carrinho está vazio.</p>
    <button>Finalizar compra</button>
  </div>
</body>
</html>
