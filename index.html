<<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LojinhaDev</title>
  <link rel="stylesheet" href="style/global.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-conteudo">
      <span class="logo">🛒 Lojinha<strong>Dev</strong></span>
      <span class="navbar-carrinho">🛒 Carrinho <b id="contador-nav">0</b></span>
    </div>
  </nav>

  <header class="hero">
    <span class="hero-selo">Setup de programador</span>
    <h1>Equipamentos para quem programa</h1>
    <p>Teclados, mouses, áudio e vídeo para o seu setup.</p>
  </header>

  <main class="layout">

    <section class="painel">
      <div class="painel-titulo">
        <h2>Produtos</h2>
        <span class="contador" id="contador-produtos">5 itens</span>
      </div>
      <div class="grade" id="grade"></div>
    </section>

    <aside class="painel carrinho">
      <div class="painel-titulo">
        <h2>Carrinho</h2>
        <span class="contador" id="contador-carrinho">0 itens</span>
      </div>

      <div id="lista-carrinho"></div>

      <div class="resumo">
        <div class="resumo-linha">
          <span>Subtotal</span>
          <span id="subtotal">R$ 0,00</span>
        </div>
        <div class="resumo-linha">
          <span>Frete</span>
          <span>Grátis</span>
        </div>
        <div class="resumo-linha resumo-total">
          <span>Total</span>
          <span id="total">R$ 0,00</span>
        </div>
      </div>

      <button class="btn btn-principal" id="btn-finalizar">Finalizar compra</button>
    </aside>

  </main>

  <footer class="rodape">
    <p>© 2026 LojinhaDev • Feito com HTML, CSS e JavaScript</p>
  </footer>

  <div class="aviso" id="aviso"></div>

  <script src="js/script.js"></script>
</body>
</html>
